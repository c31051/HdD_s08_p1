name: a4_s08_cache
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  activar-otro:
    runs-on: ubuntu-latest
    steps:
      - name: Activar Flujo Destino 1
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              workflow_id: 'a2_s08_inicio.yml',
              ref: 'main'
            })

      - name: Activar Flujo Destino 2
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: a2_s08_inicio.yml
          token: ${{ secrets.GITHUB_TOKEN }}